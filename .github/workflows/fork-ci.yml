name: Fork CI

# Lightweight checks for HeeyunCho/herdr pull requests: formatting, clippy and
# the Rust test suite on Linux. The upstream workflows (ci.yml and friends) are
# written for herdrdev/herdr; this one only runs on the fork.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt, clippy, nextest (linux)
    if: github.repository == 'HeeyunCho/herdr'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo nextest
        env:
          NEXTEST_RETRIES: "2"
        run: cargo nextest run --locked --status-level fail --final-status-level fail --failure-output final
